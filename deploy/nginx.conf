# Apex canonical host. TLS may terminate upstream — these 301s still apply on :80
# or when this config is included behind HTTPS.
server {
    listen 80;
    server_name www.vigodesk.com pdf.zuvigo.com;
    return 301 https://vigodesk.com$request_uri;
}

server {
    listen 80;
    server_name vigodesk.com;
    root /usr/share/nginx/html;
    index index.html;

    # Retire duplicate marketing URLs
    location = /billing {
        return 301 /pricing;
    }
    location = /api-docs {
        return 301 /developer;
    }
    location = /api-docs/ {
        return 301 /developer;
    }

    # Private / token routes — defense-in-depth noindex
    location ^~ /sign/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /s/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /ai/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets — long cache, immutable (^~ wins over SPA regex)
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must revalidate on deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Known SPA / prerender route prefixes — 200 + index.html fallback
    location ~ ^/(desktop|esign|enterprise|letters|diagrams|webreports|workspace|pricing|billing|security|developer|api-docs|blog|about|privacy|terms|gdpr|docs|login|register|verify-email|forgot-password|reset-password|history|profile|settings|sign|ai|orgs|oauth)(/|$) {
        try_files $uri $uri/ /index.html;
    }

    # Exact home
    location = / {
        try_files /index.html =404;
    }

    # Static files (robots, sitemap, llms, manifest, logo, images, prerender shells)
    location / {
        try_files $uri $uri/ =404;
    }

    # Content Security Policy for the static shell
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com; connect-src 'self' https://apipdf.zuvigo.com wss://apipdf.zuvigo.com https://accounts.google.com https://login.microsoftonline.com https://login.live.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://checkout.razorpay.com https://accounts.google.com https://login.microsoftonline.com;" always;
}
